<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Odyssey Studio</title>
<meta name="description" content="Practise the value curve from HEC Paris' Reinventing Your Business Model (Odyssey 3.14): eight cases, predict-then-reveal practice, and a builder with a course-based coach.">
<meta property="og:title" content="Odyssey Studio">
<meta property="og:description" content="Draw the curve. Then see how the course reads it.">
<meta name="theme-color" content="#F4F2EC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='%2313161D'/%3E%3Cpath d='M5 22 L12 12 L19 18 L27 8' fill='none' stroke='%237C766A' stroke-width='2' stroke-dasharray='3 3' stroke-linecap='round'/%3E%3Cpath d='M5 18 L12 21 L19 9 L27 14' fill='none' stroke='%23F4F2EC' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='19' cy='9' r='3' fill='%23E0522B'/%3E%3C/svg%3E">
<style>[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>:root{--paper:#F4F2EC;--paper-2:#EBE8DF;--card:#FBFAF6;--ink:#13161D;--ink-2:#444956;--ink-3:#5F6572;
--line:#D6D1C4;--line-2:#E5E1D6;--line-strong:#8F887A;--ref:#7C766A;--you:#2442E6;--ai:#B8401C;--ok:#17794F;--warn:#8A5208;--truth:#13161D;
--you-bg:#E4E8FC;--ai-bg:#FBE6DE;--ok-bg:#E1F0E7;--warn-bg:#F6EAD3;--on-ink:#F4F2EC;--shadow:0 1px 0 rgba(19,22,29,.04),0 18px 40px -22px rgba(19,22,29,.28);
--grain:.05;
--hec:#00447C;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0E1117;--paper-2:#141923;--card:#181D27;--ink:#EEEBE3;--ink-2:#C2BFB6;--ink-3:#9EA2AE;
--line:#2C3342;--line-2:#222937;--line-strong:#59627A;--ref:#A39D8E;--you:#8CA0FF;--ai:#FF8C68;--ok:#5BCB93;--warn:#EDB25A;--truth:#EEEBE3;
--you-bg:#202849;--ai-bg:#3A2219;--ok-bg:#16301F;--warn-bg:#3A2D14;--on-ink:#0E1117;--shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -22px rgba(0,0,0,.7);
--grain:.07;
--hec:#9DBDEB;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1117;--paper-2:#141923;--card:#181D27;--ink:#EEEBE3;--ink-2:#C2BFB6;--ink-3:#9EA2AE;
--line:#2C3342;--line-2:#222937;--ref:#A39D8E;--you:#8CA0FF;--ai:#FF8C68;--ok:#5BCB93;--warn:#EDB25A;--truth:#EEEBE3;
--you-bg:#202849;--ai-bg:#3A2219;--ok-bg:#16301F;--warn-bg:#3A2D14;--on-ink:#0E1117;--shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -22px rgba(0,0,0,.7);
--grain:.07;
--hec:#9DBDEB;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-inline:clamp(16px,4vw,48px);padding-block:0;min-height:100%;overflow-x:hidden}
body::before{content:none;position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.wrap{max-width:1280px;margin-inline:auto;position:relative;z-index:1}
h1,h2,h3,h4{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.mono,.eyebrow{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase}
.eyebrow{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--you);outline-offset:3px;border-radius:4px}
h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:20px;padding:14px 0;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2);margin-inline:calc(-1*clamp(16px,4vw,48px));padding-inline:clamp(16px,4vw,48px)}
.top-in{display:flex;align-items:center;gap:20px;width:100%;max-width:1280px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Instrument Serif',serif;font-size:1.45rem;line-height:1;white-space:nowrap;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;gap:4px;margin-left:auto;position:relative;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:8px 12px;color:var(--ink-3);font-weight:500;font-size:.93rem;position:relative;white-space:nowrap;transition:color .2s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current=page]{color:var(--ink)}
.nav .bar{position:absolute;bottom:0;height:2px;background:var(--ink);border-radius:2px;transition:left .35s cubic-bezier(.3,.8,.2,1),width .35s cubic-bezier(.3,.8,.2,1);pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;transition:transform .2s,border-color .2s}
.icon-btn:hover{border-color:var(--ink-3)}
.icon-btn svg{width:18px;height:18px}
@media(max-width:640px){.top{gap:10px;padding-block:10px 2px}.brand span{display:none}.top-in{gap:4px 8px;flex-wrap:wrap}.icon-btn{margin-left:auto}.nav{order:3;flex:1 1 100%;margin-left:0;gap:0;justify-content:space-between;overflow:visible}.nav button{padding:8px 3px;font-size:.85rem}}

main{padding-block:clamp(28px,5vw,56px) 40px;min-height:70vh}
.view{animation:viewin .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 22px;font-weight:600;font-size:.95rem;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);transition:transform .2s,box-shadow .2s,background .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(19,22,29,.5)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--paper-2);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.85rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.you{background:var(--you);border-color:var(--you);color:var(--on-ink)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--on-ink)}
.arrow{display:inline-block;transition:transform .25s}
.btn:hover .arrow{transform:translateX(4px)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:center;padding-block:clamp(8px,3vw,40px) clamp(40px,6vw,80px)}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2.5rem,5.4vw,4.7rem);line-height:.98;margin:18px 0 22px}
.hero h1 em{font-style:italic;color:var(--ink)}
.hero .lede{font-size:clamp(1.05rem,1.6vw,1.22rem);color:var(--ink-2);max-width:34em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 10px;box-shadow:var(--shadow);position:relative;min-width:0}
.hero-card .cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 6px 0}
.hero-card .cap b{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.5rem;transition:opacity .4s}
.hero-card .dots{display:flex;gap:6px}
.hero-card .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.hero-card .dots i.on{background:var(--ink);transform:scale(1.4)}
.hero-note{font-size:.82rem;color:var(--ink-3);padding:6px 6px 10px}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-block:10px 0}
.strip>div{padding:24px 22px 24px 0;min-width:0}
.strip>div+div{padding-left:22px;border-left:1px solid var(--line)}
.strip .n{font-family:'Instrument Serif',serif;font-size:2.6rem;line-height:1;color:var(--ink-3)}
.strip h3{font-size:1.5rem;margin:8px 0 6px}
.strip p{color:var(--ink-2);font-size:.95rem}
@media(max-width:760px){.strip{grid-template-columns:1fr}.strip>div,.strip>div+div{padding:18px 0;border-left:0}.strip>div+div{border-top:1px solid var(--line)}}

.sec{padding-top:clamp(44px,7vw,88px)}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.sec-h h2{font-size:clamp(2rem,4vw,3.1rem);line-height:1.02;max-width:16em}
.sec-h p{color:var(--ink-2);max-width:30em}

.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:860px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;min-height:250px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .35s}
.mode:hover{transform:translateY(-6px);border-color:var(--ink-3);box-shadow:var(--shadow)}
.mode .ix{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-3)}
.mode h3{font-size:2.1rem;line-height:1}
.mode p{color:var(--ink-2);font-size:.96rem}
.mode .go{margin-top:auto;font-weight:600;display:flex;align-items:center;gap:8px}
.mode svg.bg{position:absolute;right:-20px;bottom:-14px;width:150px;opacity:.16;transition:opacity .4s,transform .5s}
.mode:hover svg.bg{opacity:.34;transform:translate(-8px,-6px)}

.cases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:1020px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.cases{grid-template-columns:1fr}}
.case{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;transition:transform .3s,border-color .3s,box-shadow .3s;min-width:0}
.case:hover{transform:translateY(-5px);border-color:var(--ink-3);box-shadow:var(--shadow)}
.case h3{font-size:1.65rem;line-height:1.05}
.case .vs{color:var(--ink-3);font-size:.85rem}
.case svg{width:100%;height:70px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);width:fit-content;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.k-course{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.k-analysis{color:var(--ink-2);border-color:var(--line)}
.k-built{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

.ground{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);background:var(--ink);color:var(--on-ink);border-radius:26px;padding:clamp(26px,4vw,56px)}
.ground h2{font-size:clamp(2rem,3.6vw,2.9rem);line-height:1.02}
.ground p,.ground li{color:color-mix(in srgb,var(--on-ink) 78%,transparent)}
.ground ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.ground li{display:grid;grid-template-columns:28px 1fr;gap:8px}
.ground li b{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--on-ink)}
@media(max-width:820px){.ground{grid-template-columns:1fr}}

/* chart */
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 10px;box-shadow:var(--shadow);min-width:0}
.vc{width:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.vc text{font-family:'Hanken Grotesk',system-ui,sans-serif;fill:var(--ink-2)}
.vc .ylab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;fill:var(--ink-3)}
.vc .xlab{font-size:11.5px;font-weight:500;cursor:pointer}
.vc .xlab.on{fill:var(--ink);font-weight:700}
.vc .xlab.ph{font-style:italic;fill:var(--ink-3)}
.vc .grid{stroke:var(--line-2);stroke-width:1}
.vc .col{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 5}
.vc .col.on{stroke:var(--ink-3);stroke-dasharray:none;opacity:.5}
.vc .path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.vc .s-ref .path{stroke:var(--ref);stroke-dasharray:7 7;stroke-width:2.4}
.vc .s-ref .dot{fill:var(--card);stroke:var(--ref);stroke-width:2.4}
.vc .s-you .path{stroke:var(--you)}
.vc .s-you .dot{fill:var(--you);stroke:var(--card);stroke-width:3}
.vc .s-ai .path{stroke:var(--ai)}
.vc .s-ai .dot{fill:var(--ai);stroke:var(--card);stroke-width:3}
.vc .s-truth .path,.vc .s-new .path{stroke:var(--truth)}
.vc .s-truth .dot,.vc .s-new .dot{fill:var(--truth);stroke:var(--card);stroke-width:3}
.vc .dot{transition:r .2s}
.vc .drag .dot{cursor:grab}
.vc .drag .dot:hover,.vc .dot.act{r:11}
.vc .halo{fill:var(--you);opacity:0;transition:opacity .2s}
.vc .s-ref .halo{fill:var(--ref)}
.vc .hit{fill:transparent;cursor:grab;touch-action:none}
.vc .drag .hit:active{cursor:grabbing}
.vc .gap{stroke-width:7;stroke-linecap:round;opacity:.32}
.vc .gap.up{stroke:var(--ok)}
.vc .gap.dn{stroke:var(--warn)}
.vc .tip rect{fill:var(--ink)}
.vc .tip text{fill:var(--on-ink);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;text-anchor:middle}
.vc .tip{pointer-events:none;transition:opacity .15s}
.vc .colhit{fill:transparent}
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:6px 6px 8px;font-size:.88rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:26px;height:0;border-top:3px solid var(--you);border-radius:2px}
.legend i.ref{border-top:3px dashed var(--ref)}
.legend i.ai{border-color:var(--ai)}
.legend i.truth{border-color:var(--truth)}
.legend .sp{margin-left:auto;display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:500;color:var(--ink-2);transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed=true],.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* explore */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:thin;margin-bottom:10px}
.pills .chip{white-space:nowrap}
.case-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(18px,4vw,56px);align-items:end;margin-bottom:36px}
@media(max-width:820px){.case-head{grid-template-columns:1fr}}
.case-head h1{font-size:clamp(2.6rem,5.4vw,4.4rem);line-height:.98}
.case-head h1 small{display:block;font-size:.4em;color:var(--ink-3);font-style:italic;margin-top:8px}
.case-head .tagline{font-family:'Instrument Serif',serif;font-style:italic;font-size:1.5rem;color:var(--ink-2);margin-top:10px}
.meta{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:14px;color:var(--ink-3);font-size:.85rem;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1.95fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media(max-width:980px){.side{position:static}.two.prac>.side{order:-1}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.panel h3{font-size:1.5rem;margin-bottom:8px}
.attr-list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.attr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 10px;border-top:1px solid var(--line-2);border-radius:10px;cursor:pointer;transition:background .2s}
.attr:first-child{border-top:0}
.attr:hover,.attr.on{background:var(--paper-2)}
.attr b{font-weight:600}
.attr p{grid-column:1/-1;color:var(--ink-2);font-size:.9rem;max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .35s,margin .3s}
.attr.on p{max-height:240px;opacity:1;margin-top:6px}
.delta{font-family:'IBM Plex Mono',monospace;font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap;height:fit-content;align-self:center}
.delta.up{background:var(--ok-bg);color:var(--ok)}
.delta.dn{background:var(--warn-bg);color:var(--warn)}
.read{margin-top:16px;font-family:'Instrument Serif',serif;font-size:1.35rem;line-height:1.3;color:var(--ink)}
.read em{color:var(--ink);font-weight:600;font-style:normal}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:44px;overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 16px;color:var(--ink-3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tab-body{padding-top:24px}
.dirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dir{border:1px dashed var(--line-strong);border-radius:14px;padding:14px 16px;background:var(--card);transition:opacity .3s,border-color .3s,transform .3s;min-width:0}
.dir.used{opacity:1;border-color:var(--ink);background:var(--paper-2)}
.dir .no{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-3)}
.dir h4{font-size:1.2rem;line-height:1.15;margin:3px 0 4px}
.dir p{font-size:.86rem;color:var(--ink-2)}
.dir .why{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--ink)}
.grp-t{margin:22px 0 10px}
.chain{display:flex;gap:0;overflow-x:auto;padding-bottom:8px}
.step{flex:1 0 190px;position:relative;padding:18px 18px 18px 22px;background:var(--card);border:1px solid var(--line);border-left:0;min-width:0}
.step:first-child{border-left:1px solid var(--line);border-radius:16px 0 0 16px}
.step:last-child{border-radius:0 16px 16px 0}
.step h4{font-size:1.25rem;margin-bottom:4px}
.step p{font-size:.88rem;color:var(--ink-2)}
.step .num{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-3)}
.contrib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:820px){.contrib{grid-template-columns:1fr}}
.contrib ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:.92rem;display:grid;gap:6px}
.prov{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:.84rem;color:var(--ink-3);border-left:2px solid var(--line);padding-left:12px}

/* compare */
.cmp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:900px){.cmp-grid{grid-template-columns:1fr}}
.sel{width:100%;appearance:none;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
table.t th,table.t td{text-align:left;padding:12px 10px;border-top:1px solid var(--line-2);vertical-align:top}
table.t th{font-family:'IBM Plex Mono',monospace;font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-top:0}
table.t td:first-child{color:var(--ink-3);width:28%}
.tw{overflow-x:auto}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{font-family:'IBM Plex Mono',monospace;font-size:.75rem;padding:2px 8px;border-radius:8px;background:var(--paper-2);color:var(--ink-2)}
.dchip.both{background:var(--ink);color:var(--on-ink)}

/* practice */
.steps{display:flex;gap:10px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font-size:.88rem;font-weight:500}
.steps b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:500}
.steps .on{color:var(--ink)}
.steps .on b{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.steps .done b{background:var(--ok);color:var(--on-ink);border-color:var(--ok)}
.steps i{width:24px;height:1px;background:var(--line)}
.brief{font-family:'Instrument Serif',serif;font-size:clamp(1.4rem,2.4vw,1.9rem);line-height:1.28;max-width:30em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{font-size:.8rem;padding:5px 11px}
.chips .chip small{font-family:'IBM Plex Mono',monospace;color:inherit;opacity:.65}
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:112px;height:112px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--line-2)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Instrument Serif',serif;font-size:2.1rem;font-weight:400}
.verdict{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.v-hit{background:var(--ok-bg);color:var(--ok)}
.v-near{background:var(--paper-2);color:var(--ink-2)}
.v-miss{background:var(--warn-bg);color:var(--warn)}
.ptable{display:grid;gap:0}
.prow{display:grid;grid-template-columns:minmax(0,1.1fr) auto auto auto;gap:6px 14px;padding:12px 4px;border-top:1px solid var(--line-2);align-items:center;opacity:0;animation:viewin .5s both;animation-delay:var(--d,0s)}
.prow p{grid-column:1/-1;font-size:.88rem;color:var(--ink-2)}
.prow .num{font-family:'IBM Plex Mono',monospace;font-size:.85rem}
.note{background:var(--paper-2);border-radius:14px;padding:14px 16px;font-size:.92rem;color:var(--ink-2)}
.note b{color:var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:700px){.pcards{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:transform .3s,border-color .3s,box-shadow .3s}
.pcard:hover{transform:translateY(-5px);border-color:var(--ink-3);box-shadow:var(--shadow)}
.pcard h3{font-size:1.9rem;line-height:1.05}
.pcard p{color:var(--ink-2);font-size:.93rem}
.best{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ok)}

/* build */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.lab{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.inp,textarea.inp{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;padding:10px 13px;transition:border-color .2s,box-shadow .2s;resize:vertical}
.inp:focus{outline:0;border-color:var(--you);box-shadow:0 0 0 4px color-mix(in srgb,var(--you) 18%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.arow{display:grid;grid-template-columns:24px minmax(0,1fr) 34px;gap:8px;align-items:center;margin-bottom:8px}
.arow .ix{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-3);text-align:right}
.arow .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink-3)}
.arow .x:hover{color:var(--warn);border-color:var(--warn)}
.sides{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.chk{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 6px;border-radius:10px;transition:background .3s}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);color:var(--ink-3);transition:background-color .2s,border-color .2s,color .2s}
.chk.ok .ic{background:var(--ok);border-color:var(--ok);color:var(--on-ink)}
.chk.warn .ic{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chk b{font-weight:600;display:block;font-size:.95rem}
.chk span.d{display:block;color:var(--ink-2);font-size:.86rem}
.chk{opacity:0;animation:viewin .45s both;animation-delay:var(--d,0s)}
.meter{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--you),var(--ok));width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.mini-h{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px}
.qs{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink-2);font-size:.93rem}
.aibox{border:1px solid color-mix(in srgb,var(--ai) 45%,transparent);background:linear-gradient(180deg,var(--ai-bg),var(--card) 70%);border-radius:18px;padding:18px 20px;margin-top:16px}
.aibox h4{font-size:1.35rem;margin-bottom:6px}
.aibox p,.aibox li{font-size:.92rem;color:var(--ink-2)}
.aibox ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.hint{font-size:.85rem;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:all .35s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stack{display:grid;gap:18px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer{border-top:1px solid var(--line);padding-block:30px 40px;margin-top:60px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ink-3);font-size:.85rem;position:relative;z-index:1}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;width:100%}
.method h2{font-size:2.2rem;margin:36px 0 10px}
.method p,.method li{color:var(--ink-2);max-width:46em}
.method ul{display:grid;gap:8px;padding-left:20px}
.rules{counter-reset:r;display:grid;gap:12px;list-style:none;padding:0}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;gap:10px}
.rules li::before{content:counter(r);font-family:'Instrument Serif',serif;font-size:1.8rem;line-height:1;color:var(--ink-3)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
.method .dir{opacity:1}
.chip.sm{padding:5px 11px;font-size:.8rem}

.two.build{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:stretch}
.chart-card.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.chart-card{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 96px)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,40px);margin-top:10px}
@media(max-width:820px){.fgrid{grid-template-columns:1fr}}
.chartcol{min-width:0}
@media(max-width:980px){.two.build{grid-template-columns:minmax(0,1fr)}.chart-card.stick{position:static}}

.hec-sep{width:1px;height:26px;background:var(--line);flex:none}
.top .hec{height:28px}
.top-lock{display:flex;align-items:center;gap:14px}
@media(max-width:760px){.top .hec,.top .hec-sep{display:none}}
footer .hec{height:34px}
.foot-l{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

.ghead{display:flex;align-items:center;gap:10px;padding:2px 6px 8px;flex-wrap:wrap}
.ghead b{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.5rem;line-height:1}
.ghead .push{margin-left:auto}
.chartcol{display:grid;gap:18px;align-content:start}
.chartcol.multi .chart-card{cursor:pointer;transition:border-color .25s,box-shadow .25s}
.chartcol.multi .chart-card.active{border-color:var(--you);box-shadow:0 0 0 3px color-mix(in srgb,var(--you) 16%,transparent),var(--shadow);cursor:default}

.vc .s-airef .path{stroke:var(--ai);stroke-dasharray:7 7;stroke-width:2.4;opacity:.85}
.vc .s-airef .dot{fill:var(--card);stroke:var(--ai);stroke-width:2.4}

    <li><span><b>Five to eight attributes</b> <span class="badge">tool rule of thumb</span> Enough to show a profile, few enough to read.</span></li>

    <li><span><b>One curve per customer group.</b> A model that serves two groups, such as buyers and sellers, needs a curve for each.</span></li>

    finally { aiEnd(ctl); }
  }
  const reasonLi = (o, sd) => h('li', null, h('b', { text: o.l + '. ' }), `You ${fmt(o.mine.r)} → ${fmt(o.mine.n)}; coach ${fmt(o.r)} → ${fmt(o.n)} (${o.conf} confidence).`,
    h('div', { class: 'why2' }, h('span', { class: 'mono', text: sd.ref || 'Reference' }), ' ' + o.whyRef), h('div', { class: 'why2' }, h('span', { class: 'mono', text: sd.neu || 'New offer' }), ' ' + o.whyNew));
  function drawAll() { items = {}; coachEl.textContent = ''; aiEl.textContent = ''; drawForm(); drawChart(true); drawCoach(); }
  drawAll();
  aiHook = drawAIBtns;
}
let aiHook = null;

/* ---------- boot ---------- */
(async function boot() {
  shell(); fromHash();
  const app = h('main', { id: 'app', class: 'wrap' }); document.body.insertBefore(app, document.querySelector('footer'));
  document.body.append(h('div', { id: 'toast', class: 'toast', role: 'status' }));
  paint();
})();
</script>
